<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Estadísticas - Liga Milan United FC</title><style>body{font-family:Arial;background:linear-gradient(135deg,#0f5132,#198754);color:white;padding:18px}.card{background:#ffffff1a;padding:18px;border-radius:14px;margin:14px 0}.nav,.grid{display:flex;gap:10px;flex-wrap:wrap}.nav a{background:#ffc107;color:#111;padding:10px;border-radius:8px;text-decoration:none;font-weight:bold}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}.player{background:#ffffff18;padding:14px;border-radius:10px}.track{background:#ffffff30;border-radius:5px;margin:4px 0 12px}.bar{background:#ffc107;color:#111;padding:5px;border-radius:5px}</style></head><body><h1>Estadísticas individuales</h1><nav class="card nav"><a href="index.html">Inicio</a><a href="equipo-a.html">Equipo A</a><a href="equipo-b.html">Equipo B</a><a href="general.html">Tabla general</a><a href="retirados.html">Retirados</a></nav><section class="card"><p>Comparación individual de goles, asistencias, defensas y atajadas de los jugadores activos.</p><div id="stats" class="grid">Cargando estadísticas…</div></section><script type="module">import{initializeApp}from"https://www.gstatic.com/firebasejs/12.14.0/firebase-app.js";import{getFirestore,doc,getDoc}from"https://www.gstatic.com/firebasejs/12.14.0/firebase-firestore.js";const app=initializeApp({apiKey:"AIzaSyBin3BZQABrtgCgIi7PAnumHs473JVXagc",authDomain:"liga-milan-united.firebaseapp.com",projectId:"liga-milan-united",storageBucket:"liga-milan-united.firebasestorage.app",messagingSenderId:"395474896963",appId:"1:395474896963:web:a7ff5386d47db873e7ecf6"});const db=getFirestore(app);const puntos=j=>(j.goles||0)*4+(j.asistencias||0)*3+(j.defensas||0)*2+(j.atajadas||0)*2+(j.participaciones||0);async function cargar(){const s=await getDoc(doc(db,"ligaDatos","datosLiga"));const jugadores=s.exists()?s.data().jugadores||{}:{};const lista=Object.values(jugadores).filter(j=>!j.retirado).sort((a,b)=>puntos(b)-puntos(a));const max=Math.max(1,...lista.flatMap(j=>[j.goles||0,j.asistencias||0,j.defensas||0,j.atajadas||0]));const root=document.getElementById("stats");root.innerHTML="";lista.forEach(j=>{const c=document.createElement("article");c.className="player";const h=document.createElement("h3");h.textContent=j.nombre;c.appendChild(h);const p=document.createElement("p");p.textContent="Equipo "+j.equipo+" · "+puntos(j)+" puntos";c.appendChild(p);[["Goles",j.goles],["Asistencias",j.asistencias],["Defensas",j.defensas],["Atajadas",j.atajadas]].forEach(([t,v])=>{const n=Number(v)||0;const d=document.createElement("div");d.textContent=t+": "+n;const tr=document.createElement("div");tr.className="track";const b=document.createElement("div");b.className="bar";b.style.width=(n/max*100)+"%";b.textContent=n;tr.appendChild(b);d.appendChild(tr);c.appendChild(d)});root.appendChild(c)});if(!lista.length)root.textContent="No hay jugadores activos registrados."}cargar().catch(()=>document.getElementById("stats").textContent="No se pudieron cargar los datos. Revisa la conexión con Firebase.");</script></body></html>
